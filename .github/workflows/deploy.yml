name: Build & Test CI/CD

on:
  push:
    branches: [ "main", "staging" ]
  pull_request:
    branches: [ "main", "staging" ]

jobs:
  # 1. Validasi & Build Frontend
  frontend-build:
    name: Test & Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Typecheck TypeScript
        working-directory: ./frontend
        run: npm run typecheck

      - name: Build Production Frontend
        working-directory: ./frontend
        run: npm run build

  # 2. Validasi & Kompilasi Backend Golang (Linux AMD64)
  backend-build:
    name: Build Go Backend for Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: 'backend/go.sum'

      - name: Verify Go Modules
        working-directory: ./backend
        run: go mod verify

      - name: Run Backend Unit Tests (BE-12)
        working-directory: ./backend
        run: go test -v ./...

      - name: Compile Linux Binary (Zero CGO)
        working-directory: ./backend
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o hujan-backend-linux main.go

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hujan-backend-linux
          path: backend/hujan-backend-linux

  # 3. Deploy Otomatis Binary ke VPS Tencent Cloud via SSH
  deploy-to-vps:
    name: Auto Deploy to Tencent VPS
    needs: [backend-build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    runs-on: ubuntu-latest
    steps:
      - name: Download Compiled Linux Binary
        uses: actions/download-artifact@v4
        with:
          name: hujan-backend-linux
          path: ./

      - name: Check VPS Credentials
        id: check-creds
        run: |
          if [ -n "${{ secrets.VPS_HOST }}" ] && ([ -n "${{ secrets.VPS_PASSWORD }}" ] || [ -n "${{ secrets.VPS_SSH_KEY }}" ]); then
            echo "configured=true" >> $GITHUB_OUTPUT
          else
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "::notice ::VPS SSH Secrets belum diatur di GitHub Secrets (VPS_HOST, VPS_PASSWORD / VPS_SSH_KEY). Step auto-deploy dilewati."
          fi

      - name: Stop Old Service Before Upload
        if: steps.check-creds.outputs.configured == 'true'
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME || 'root' }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set +e
            mkdir -p /www/wwwroot/hujan-backend-staging
            mkdir -p /www/wwwroot/hujan-backend-prod
            systemctl stop hujan-backend-staging 2>/dev/null
            systemctl stop hujan-backend 2>/dev/null
            systemctl stop hujan-backend-prod 2>/dev/null
            pkill -9 -f hujan-backend-linux 2>/dev/null
            exit 0

      - name: Copy Binary to VPS via SCP
        if: steps.check-creds.outputs.configured == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME || 'root' }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "hujan-backend-linux"
          target: "/www/wwwroot/hujan-backend-staging"

      - name: Set Permissions & Restart Systemd Service
        if: steps.check-creds.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME || 'root' }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set +e

            # 1. Pastikan Service MySQL Berjalan di VPS
            systemctl start mysqld 2>/dev/null || systemctl start mysql 2>/dev/null || /etc/init.d/mysqld start 2>/dev/null || true

            # 2. Ambil Kredensial Asli Database dari Config aaPanel
            PY_CMD="python3"
            [ -f /www/server/panel/pyenv/bin/python ] && PY_CMD="/www/server/panel/pyenv/bin/python"

            STAGING_PW=$($PY_CMD -c "import sqlite3; conn=sqlite3.connect('/www/server/panel/data/default.db'); c=conn.cursor(); c.execute(\"SELECT password FROM databases WHERE name='hujan_iot_staging'\"); r=c.fetchone(); print(r[0] if r else '')" 2>/dev/null || echo "")

            PROD_PW=$($PY_CMD -c "import sqlite3; conn=sqlite3.connect('/www/server/panel/data/default.db'); c=conn.cursor(); c.execute(\"SELECT password FROM databases WHERE name='hujan_iot_prod'\"); r=c.fetchone(); print(r[0] if r else '')" 2>/dev/null || echo "")

            echo "Status Kredensial aaPanel: Staging=$([ -n "$STAGING_PW" ] && echo 'OK' || echo 'KOSONG'), Prod=$([ -n "$PROD_PW" ] && echo 'OK' || echo 'KOSONG')"

            # 3. Sinkronisasi Binary ke Staging dan Production
            mkdir -p /www/wwwroot/hujan-backend-staging
            mkdir -p /www/wwwroot/hujan-backend-prod

            # Hapus database sqlite sementara agar murni menggunakan MySQL
            rm -f /www/wwwroot/hujan-backend-staging/*.db 2>/dev/null || true
            rm -f /www/wwwroot/hujan-backend-prod/*.db 2>/dev/null || true

            if [ -f /www/wwwroot/hujan-backend-staging/hujan-backend-linux ]; then
              cp -f /www/wwwroot/hujan-backend-staging/hujan-backend-linux /www/wwwroot/hujan-backend-prod/hujan-backend-linux 2>/dev/null || true
            fi
            chmod +x /www/wwwroot/hujan-backend-staging/hujan-backend-linux 2>/dev/null || true
            chmod +x /www/wwwroot/hujan-backend-prod/hujan-backend-linux 2>/dev/null || true

            # 4. Pasang & Aktifkan Unit Service Staging (Port 8080) -> Database hujan_iot_staging
            printf '[Unit]\nDescription=HujanPantau IoT Go Backend (Staging)\nAfter=network.target mysql.service\n\n[Service]\nType=simple\nUser=root\nWorkingDirectory=/www/wwwroot/hujan-backend-staging\nExecStart=/www/wwwroot/hujan-backend-staging/hujan-backend-linux\nRestart=always\nRestartSec=5\nEnvironment=PORT=8080\nEnvironment=MQTT_BROKER=tcp://test.mosquitto.org:1883\nEnvironment=DB_TYPE=mysql\nEnvironment=MYSQL_USER=hujan_iot_staging\nEnvironment=MYSQL_PASSWORD=%s\nEnvironment=MYSQL_DATABASE=hujan_iot_staging\nEnvironment=MYSQL_HOST=127.0.0.1\nEnvironment=MYSQL_PORT=3306\nEnvironment=TELEGRAM_BOT_TOKEN=8823338938:AAG969OA9yWwB-Ujj-UGSMTcQnhFVk45_pI\nEnvironment=TELEGRAM_BOT_USERNAME=Rintik_Iot_Bot\n\n[Install]\nWantedBy=multi-user.target\n' "$STAGING_PW" > /etc/systemd/system/hujan-backend-staging.service

            # 5. Pasang & Aktifkan Unit Service Production (Port 8081) -> Database hujan_iot_prod
            printf '[Unit]\nDescription=HujanPantau IoT Go Backend (Production)\nAfter=network.target mysql.service\n\n[Service]\nType=simple\nUser=root\nWorkingDirectory=/www/wwwroot/hujan-backend-prod\nExecStart=/www/wwwroot/hujan-backend-prod/hujan-backend-linux\nRestart=always\nRestartSec=5\nEnvironment=PORT=8081\nEnvironment=MQTT_BROKER=tcp://test.mosquitto.org:1883\nEnvironment=DB_TYPE=mysql\nEnvironment=MYSQL_USER=hujan_iot_prod\nEnvironment=MYSQL_PASSWORD=%s\nEnvironment=MYSQL_DATABASE=hujan_iot_prod\nEnvironment=MYSQL_HOST=127.0.0.1\nEnvironment=MYSQL_PORT=3306\nEnvironment=TELEGRAM_BOT_TOKEN=8823338938:AAG969OA9yWwB-Ujj-UGSMTcQnhFVk45_pI\nEnvironment=TELEGRAM_BOT_USERNAME=Rintik_Iot_Bot\n\n[Install]\nWantedBy=multi-user.target\n' "$PROD_PW" > /etc/systemd/system/hujan-backend-prod.service

            systemctl daemon-reload
            systemctl enable hujan-backend-staging hujan-backend-prod
            systemctl restart hujan-backend-staging hujan-backend-prod
            sleep 3
            echo "Layanan Backend Staging (8080) dan Production (8081) aktif menggunakan MySQL!"
            exit 0

name: Build & Test CI/CD

on:
  push:
    branches: [ "main", "staging" ]
  pull_request:
    branches: [ "main", "staging" ]

jobs:
  # 1. Validasi & Build Frontend
  frontend-build:
    name: Test & Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Typecheck TypeScript
        working-directory: ./frontend
        run: npm run typecheck

      - name: Build Production Frontend
        working-directory: ./frontend
        run: npm run build

  # 2. Validasi & Kompilasi Backend Golang (Linux AMD64)
  backend-build:
    name: Build Go Backend for Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: 'backend/go.sum'

      - name: Verify Go Modules
        working-directory: ./backend
        run: go mod verify

      - name: Run Backend Unit Tests (BE-12)
        working-directory: ./backend
        run: go test -v ./...

      - name: Compile Linux Binary (Zero CGO)
        working-directory: ./backend
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o hujan-backend-linux main.go

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hujan-backend-linux
          path: backend/hujan-backend-linux

  # 3. Deploy Otomatis Binary ke VPS Tencent Cloud via SSH
  deploy-to-vps:
    name: Auto Deploy to Tencent VPS
    needs: [backend-build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    runs-on: ubuntu-latest
    steps:
      - name: Download Compiled Linux Binary
        uses: actions/download-artifact@v4
        with:
          name: hujan-backend-linux
          path: ./

      - name: Check VPS Credentials
        id: check-creds
        run: |
          if [ -n "${{ secrets.VPS_HOST }}" ] && ([ -n "${{ secrets.VPS_PASSWORD }}" ] || [ -n "${{ secrets.VPS_SSH_KEY }}" ]); then
            echo "configured=true" >> $GITHUB_OUTPUT
          else
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "::notice ::VPS SSH Secrets belum diatur di GitHub Secrets (VPS_HOST, VPS_PASSWORD / VPS_SSH_KEY). Step auto-deploy dilewati."
          fi

      - name: Stop Old Service Before Upload
        if: steps.check-creds.outputs.configured == 'true'
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME || 'root' }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set +e
            mkdir -p /www/wwwroot/hujan-backend-staging
            mkdir -p /www/wwwroot/hujan-backend-prod
            systemctl stop hujan-backend-staging 2>/dev/null
            systemctl stop hujan-backend 2>/dev/null
            systemctl stop hujan-backend-prod 2>/dev/null
            pkill -9 -f hujan-backend-linux 2>/dev/null
            exit 0

      - name: Copy Binary to VPS via SCP
        if: steps.check-creds.outputs.configured == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME || 'root' }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "hujan-backend-linux"
          target: ${{ github.ref == 'refs/heads/main' && '/www/wwwroot/hujan-backend-prod' || '/www/wwwroot/hujan-backend-staging' }}

      - name: Set Permissions & Restart Systemd Service
        if: steps.check-creds.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME || 'root' }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set +e
            if [ "${{ github.ref }}" = "refs/heads/main" ]; then
              chmod +x /www/wwwroot/hujan-backend-prod/hujan-backend-linux
              cat << 'EOF' > /etc/systemd/system/hujan-backend-prod.service
[Unit]
Description=HujanPantau IoT Go Backend (Production)
After=network.target

[Service]
Type=simple
User=root
WorkingDirectory=/www/wwwroot/hujan-backend-prod
ExecStart=/www/wwwroot/hujan-backend-prod/hujan-backend-linux
Restart=always
RestartSec=5
Environment=PORT=8081
Environment=MQTT_BROKER=tcp://127.0.0.1:1883
Environment=DB_TYPE=mysql
Environment=MYSQL_USER=hujan_user
Environment=MYSQL_PASSWORD=dieBWzRk7si447bZ
Environment=MYSQL_DATABASE=hujan_iot_prod
Environment=MYSQL_HOST=127.0.0.1
Environment=MYSQL_PORT=3306

[Install]
WantedBy=multi-user.target
EOF
              systemctl daemon-reload
              systemctl enable hujan-backend-prod
              systemctl restart hujan-backend-prod
              sleep 3
              if ! ss -tulpn | grep -q ':8081 '; then
                echo "MySQL not ready, fallback to SQLite for Production..."
                sed -i 's/DB_TYPE=mysql/DB_TYPE=sqlite/' /etc/systemd/system/hujan-backend-prod.service
                systemctl daemon-reload
                systemctl restart hujan-backend-prod
              fi
              echo "✅ Backend Production berhasil diperbarui dan aktif di port 8081!"
            else
              chmod +x /www/wwwroot/hujan-backend-staging/hujan-backend-linux
              cat << 'EOF' > /etc/systemd/system/hujan-backend-staging.service
[Unit]
Description=HujanPantau IoT Go Backend (Staging)
After=network.target

[Service]
Type=simple
User=root
WorkingDirectory=/www/wwwroot/hujan-backend-staging
ExecStart=/www/wwwroot/hujan-backend-staging/hujan-backend-linux
Restart=always
RestartSec=5
Environment=PORT=8080
Environment=MQTT_BROKER=tcp://127.0.0.1:1883
Environment=DB_TYPE=mysql
Environment=MYSQL_USER=hujan_user
Environment=MYSQL_PASSWORD=dieBWzRk7si447bZ
Environment=MYSQL_DATABASE=hujan_iot_staging
Environment=MYSQL_HOST=127.0.0.1
Environment=MYSQL_PORT=3306

[Install]
WantedBy=multi-user.target
EOF
              systemctl daemon-reload
              systemctl enable hujan-backend-staging
              systemctl restart hujan-backend-staging
              sleep 3
              if ! ss -tulpn | grep -q ':8080 '; then
                echo "MySQL not ready, fallback to SQLite for Staging..."
                sed -i 's/DB_TYPE=mysql/DB_TYPE=sqlite/' /etc/systemd/system/hujan-backend-staging.service
                systemctl daemon-reload
                systemctl restart hujan-backend-staging
              fi
              echo "✅ Backend Staging berhasil diperbarui dan aktif di port 8080!"
            fi
            exit 0

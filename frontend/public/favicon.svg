<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <title>Rintik Logo</title>
  <defs>
    <!-- Vibrant Blue-Indigo-Violet Gradient (Ranition Reference ATM) -->
    <linearGradient id="rintik-tile-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B86E5"/>
      <stop offset="40%" stop-color="#7B78EA"/>
      <stop offset="75%" stop-color="#9D65E8"/>
      <stop offset="100%" stop-color="#B854E6"/>
    </linearGradient>
    <filter id="rintik-mark-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#312E81" flood-opacity="0.32"/>
    </filter>
  </defs>
  <!-- Squircle Base with Inner Glass Glow Rim -->
  <rect width="512" height="512" rx="124" fill="url(#rintik-tile-grad)"/>
  <rect x="2" y="2" width="508" height="508" rx="122" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="3" fill="none"/>

  <!-- Centered Scaled Rintik Mark -->
  <g transform="translate(80, 80) scale(1.38)" filter="url(#rintik-mark-shadow)">
    <path d="M 46 54
             C 46 44, 54 38, 64 38
             L 152 38
             C 192 38, 218 64, 218 104
             L 218 114
             C 218 122, 212 128, 204 128
             L 168 128
             C 158 128, 150 136, 150 146
             C 150 156, 158 164, 168 164
             L 204 164
             C 212 164, 218 170, 218 178
             L 218 200
             C 218 210, 210 218, 200 218
             L 164 218
             C 152 218, 140 186, 130 160
             C 122 140, 114 130, 104 130
             C 96 130, 92 136, 92 146
             L 92 204
             C 92 212, 84 218, 76 218
             L 60 218
             C 50 218, 46 210, 46 204
             Z"
          fill="#FFFFFF"/>
  </g>
</svg>
